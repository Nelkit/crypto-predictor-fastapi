[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "36120-25sp-group6-25609227-at3-fastapi"
version = "0.1.0"
description = "FastAPI service for deploying cryptocurrency price prediction models. Includes endpoints for health check, project info, and next-day HIGH price prediction for a selected token."
authors = [
  "Nelkit Chavez"
]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "==3.11.4"
fastapi = "^0.116.1"
uvicorn = "^0.35.0"
pandas = "2.2.2"
numpy = "1.26.4"
joblib = "^1.5.2"
scikit-learn = "1.5.1"
requests-cache = "^1.2.1"

[tool.poetry.extras]
deep-learning-mac = ["tensorflow-macos", "tensorflow-metal"]
deep-learning-windows = ["tensorflow"]


