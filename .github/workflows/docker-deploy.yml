name: Build and Push Docker image

on:
  pull_request:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-forecast-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/crypto-forecast-api:latest

      - name: Trigger Render deploy
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d40vh1ili9vc73c0hvq0?key=${{ secrets.RENDER_DEPLOY_KEY }}"